[project]
name = "marimo-ember"
version = "0.1.0"
description = "A warm dark theme for marimo notebooks, with a matching Plotly template"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plotly = ["plotly>=5"]

[project.scripts]
marimo-ember = "marimo_ember.__main__:main"

[project.urls]
Repository = "https://github.com/ParticleCat314/marimo-ember"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_ember"]
